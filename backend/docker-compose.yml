services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fitness_backend_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_backend_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/fitness_backend_db?schema=public"
      JWT_SECRET: "prod_jwt_access_secret_fitness_platform_2026"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: "prod_jwt_refresh_secret_fitness_platform_2026"
      JWT_REFRESH_EXPIRES_IN: "30d"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIR: "uploads"
    ports:
      - "5000:5000"
    volumes:
      - uploads_volume:/app/uploads

volumes:
  pgdata:
  uploads_volume:
